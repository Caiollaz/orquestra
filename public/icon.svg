<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    orquestra — ícone.
    Conceito: o fosso de orquestra visto de cima = um grafo de agentes.
    Quatro nós em arco (os naipes: cordas, latão, madeiras, percussão —
    as mesmas cores dos nós no app) ligados por cabos tracejados a um
    nó-maestro central (anel de latão, como o ícone de "papel" ◎ do app).
    Fundo: palco apagado com luz quente subindo do fosso.
  -->
  <defs>
    <!-- luz do fosso: brilho quente atrás do maestro -->
    <radialGradient id="pit" cx="50%" cy="66%" r="72%">
      <stop offset="0%" stop-color="#2e2318"/>
      <stop offset="45%" stop-color="#1d1712"/>
      <stop offset="100%" stop-color="#131110"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c69a55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c69a55" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- fundo squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#pit)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="224" fill="none" stroke="#c69a55" stroke-opacity="0.14" stroke-width="4"/>

  <!-- fileiras do fosso: arcos sutis atrás dos nós -->
  <g fill="none" stroke="#c69a55" stroke-opacity="0.10" stroke-width="6">
    <path d="M 200 560 A 380 380 0 0 1 824 560"/>
    <path d="M 262 626 A 300 300 0 0 1 762 626"/>
  </g>

  <!-- brilho no chão sob o maestro -->
  <ellipse cx="512" cy="712" rx="300" ry="180" fill="url(#glow)" opacity="0.5"/>

  <!-- cabos: maestro → naipes (tracejado igual às arestas do canvas) -->
  <g fill="none" stroke="#c69a55" stroke-width="16" stroke-linecap="round"
     stroke-dasharray="40 30" stroke-opacity="0.62">
    <path d="M 408 606 Q 290 556 232 452"/>
    <path d="M 472 570 Q 430 460 402 342"/>
    <path d="M 552 570 Q 594 460 622 342"/>
    <path d="M 616 606 Q 734 556 792 452"/>
  </g>

  <!-- naipes: cordas, latão, madeiras, percussão -->
  <g>
    <circle cx="216" cy="408" r="66" fill="#b3543f"/>
    <circle cx="216" cy="408" r="66" fill="#b3543f" filter="url(#soft)" opacity="0.5"/>
    <circle cx="394" cy="292" r="66" fill="#c69a55"/>
    <circle cx="394" cy="292" r="66" fill="#c69a55" filter="url(#soft)" opacity="0.5"/>
    <circle cx="630" cy="292" r="66" fill="#6f8f5e"/>
    <circle cx="630" cy="292" r="66" fill="#6f8f5e" filter="url(#soft)" opacity="0.5"/>
    <circle cx="808" cy="408" r="66" fill="#7d8fa8"/>
    <circle cx="808" cy="408" r="66" fill="#7d8fa8" filter="url(#soft)" opacity="0.5"/>
  </g>

  <!-- maestro: anel de latão (a "estante" central que rege os naipes) -->
  <circle cx="512" cy="712" r="112" fill="none" stroke="#c69a55" stroke-width="34"/>
  <circle cx="512" cy="712" r="112" fill="none" stroke="#c69a55" stroke-width="34" filter="url(#soft)" opacity="0.55"/>
  <circle cx="512" cy="712" r="34" fill="#e6ddd0"/>
</svg>
