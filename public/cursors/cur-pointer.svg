<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mãozinha: indicador esticado, palma com dedos dobrados, punho reto.
    Mestre de `pointer.png` (32px) e `pointer@2x.png` (64px) — regerar os DOIS.

    O desenho original é bom, só era grande (26x31px no render 1x). Em vez de
    redesenhar, escala no grupo — mesma silhueta, tamanho menor.

    Escala 0.82, não menos: a 0.7 dava 17x21px e a mão virava mancha preta —
    dedo dobrado e vinco da palma não sobrevivem nesse tamanho. 0.82 dá ~20x25,
    que é a faixa nativa da mãozinha (macOS/Windows ~19x24) e mantém a
    silhueta legível. Mãozinha é maior que seta nos dois sistemas.

    A escala encolhe o traço junto, então stroke-width sobe pra 2.9
    (2.9 x 0.82 ≈ 2.4 unidades, o mesmo keyline de ~1px da seta).
    Ponta do indicador → hotspot "10 1" no PNG de 32 (medido no pixel).
  -->
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#sh)" transform="translate(-4.79 -1.69) scale(0.82)">
    <path d="M26 9
             a 4.5 4.5 0 0 1 9 0
             L 35 26
             L 38 26
             Q 47 25 49 30
             Q 50 33 49 38
             L 47 48
             Q 45.5 56 37 56
             L 27 56
             Q 20 56 16.5 50
             L 9.5 38
             a 4.2 4.2 0 0 1 7 -4.6
             L 21 39
             L 26 40
             Z"
      fill="#161616" stroke="#ffffff" stroke-width="2.9" stroke-linejoin="round"/>
  </g>
</svg>
