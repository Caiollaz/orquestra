<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    orquestra — ícone do app. Mestre de todos os tamanhos:
    `pnpm tauri icon src-tauri/icons/icon.svg` regenera png/ico/icns/android/ios.
    Mantenha em sincronia com a marca da landing (site/index.html) e do titlebar.

    Sinal "oq": dois anéis que se cruzam mais a haste do q — as duas primeiras
    letras e, ao mesmo tempo, dois nós ligados, que é o produto.

    Escolhas ditadas pelo tamanho de 32px (barra de tarefas, aba, dock):
    - traço grosso (72 num anel de raio 180, 40% do raio). Traço fino some.
    - os anéis se cruzam em 20% do diâmetro externo, a mesma proporção da marca
      na landing. Com mais que isso os dois viram uma bolha só no tamanho
      pequeno — testado em 32px, foi preciso afastar.
    - sem gradiente no sinal, sem sombra, sem brilho: no ícone pequeno tudo isso
      vira sujeira cinza. O único gradiente é o do fundo, e é sutil.
    - margem de ~12% igual nos quatro lados.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171d"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <!-- squircle: mesmo raio proporcional do ícone de app de macOS/Windows 11 -->
  <rect width="1024" height="1024" rx="232" fill="url(#fundo)"/>
  <!-- fio de luz na borda: separa o ícone de um dock escuro sem inventar cor -->
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="6"/>

  <g fill="none" stroke="#ffffff" stroke-width="72" stroke-linecap="round">
    <circle cx="339" cy="464" r="180"/>
    <circle cx="685" cy="464" r="180"/>
    <path d="M865 464v276"/>
  </g>
</svg>
